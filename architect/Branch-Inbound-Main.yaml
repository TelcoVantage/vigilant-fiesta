# Archy definition – Genesys Cloud inbound call flow (same flow as Branch-Inbound-Main.i3InboundFlow)
# Publish:  archy publish --file architect/Branch-Inbound-Main.yaml --clientId ... --clientSecret ... --location mypurecloud.com.au
#
# One flow for all 60 branch DIDs. The dialed number is looked up in the
# BranchDirectory data table; option 3 transfers to the branch's Teams DID.
# Not found => variables keep their defaults (generic greeting, no Teams number).
inboundCall:
  name: Branch Inbound Main
  description: Dynamic branch IVR – data table lookup on dialed DID, common 3-option menu, option 3 transfers to the branch's Teams Auto Attendant number.
  division: Home
  startUpRef: "/inboundCall/tasks/task[initialise]"
  defaultLanguage: en-au
  supportedLanguages:
    en-au:
      defaultLanguageSkill:
        noValue: true

  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
    preHandlingAudio:
      tts: We are sorry, we are experiencing technical difficulties. Please call back later.

  settingsMenu:
    listenForExtensionDialing:
      lit: false
    menuSelectionTimeout:
      lit:
        seconds: 6
    repeatCount:
      lit: 3

  variables:
    - stringVariable:
        name: Flow.BranchCode
        initialValue:
          noValue: true
    - stringVariable:
        name: Flow.BranchName
        initialValue:
          lit: our bank
    - stringVariable:
        name: Flow.TeamsDID
        initialValue:
          noValue: true

  menus:
    - menu:
        name: Main Menu
        refId: mainMenu
        audio:
          exp: ToAudioTTS("Thank you for calling " + Flow.BranchName + ". For R O S, press 1. For Country Banking, press 2. To speak to the branch, press 3.")
        choices:
          - menuTransferToAcd:
              name: ROS
              dtmf: digit_1
              targetQueue:
                lit:
                  name: ROS
              preTransferAudio:
                tts: Please hold while we connect you.
              failureTransferAudio:
                tts: We are sorry, we are unable to connect you right now. Please try again later.
          - menuTransferToAcd:
              name: Country Banking
              dtmf: digit_2
              targetQueue:
                lit:
                  name: CB
              preTransferAudio:
                tts: Please hold while we connect you to Country Banking.
              failureTransferAudio:
                tts: We are sorry, we are unable to connect you right now. Please try again later.
          - menuJumpToTask:
              name: Speak to the Branch
              dtmf: digit_3
              targetTaskRef: "/inboundCall/tasks/task[transferToBranch]"

  tasks:
    - task:
        name: Initialise
        refId: initialise
        actions:
          - dataTableLookup:
              name: Lookup BranchDirectory
              dataTable:
                BranchDirectory
              lookupValue:
                exp: Replace(Call.CalledAddressOriginal, "tel:", "")
              outputs:
                found:
                  outputs:
                    - name: BranchCode
                      variable: Flow.BranchCode
                    - name: BranchName
                      variable: Flow.BranchName
                    - name: TeamsDID
                      variable: Flow.TeamsDID
          - setParticipantData:
              name: Set branch participant data
              attributes:
                - attribute:
                    name:
                      lit: BranchName
                    value:
                      exp: Flow.BranchName
                - attribute:
                    name:
                      lit: BranchCode
                    value:
                      exp: Flow.BranchCode
          - jumpToMenu:
              name: Go to Main Menu
              targetMenuRef: "/inboundCall/menus/menu[mainMenu]"

    - task:
        name: Transfer to Branch
        refId: transferToBranch
        actions:
          - decision:
              name: Branch has a Teams number?
              condition:
                exp: If(IsSet(Flow.TeamsDID), Flow.TeamsDID, "") != ""
              outputs:
                yes:
                  actions:
                    - transferToNumber:
                        name: Transfer to branch Teams DID
                        number:
                          exp: Flow.TeamsDID
                        preTransferAudio:
                          exp: ToAudioTTS("Transferring you to the " + Flow.BranchName + " branch now.")
                        failureTransferAudio:
                          tts: We are sorry, we could not connect you to the branch.
                        outputs:
                          failure:
                            actions:
                              - transferToAcd:
                                  name: Fallback to ROS
                                  targetQueue:
                                    lit:
                                      name: ROS
                                  preTransferAudio:
                                    tts: Please hold while we connect you to our team.
                                  failureTransferAudio:
                                    tts: We are sorry, we are unable to connect you right now. Please try again later.
                no:
                  actions:
                    - transferToAcd:
                        name: Branch unavailable – route to ROS
                        targetQueue:
                          lit:
                            name: ROS
                        preTransferAudio:
                          tts: The branch is not available right now. Please hold while we connect you to our team.
                        failureTransferAudio:
                          tts: We are sorry, we are unable to connect you right now. Please try again later.
